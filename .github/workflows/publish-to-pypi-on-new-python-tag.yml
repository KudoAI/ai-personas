name: Publish to PyPI on new python tag

on:
  push:
    tags: ["python*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.x
      - run: "pip install --only-binary :all: build"
      - run: cd python && python -m build
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1.14.1
        with:
          packages-dir: python/dist
