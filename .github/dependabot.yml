version: 2
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directories:
      - /
      - /python
    schedule:
      interval: daily
    cooldown:
      semver-minor-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    versioning-strategy: increase

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: daily
    cooldown:
      semver-minor-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
    versioning-strategy: increase
